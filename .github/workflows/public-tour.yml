name: public-tour

# The public tour (docs/PUBLIC_TOUR.md): build it from the lesson-sync bundle, run the key-leak check and the browser
# check, upload the site, and deploy it. Only the public-tour branch runs this; nothing here touches the live app.
# The build uses no secret. Deploy: Netlify when the repository secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID exist
# (otherwise the job skips its steps); GitHub Pages only when started by hand with pages: true.

on:
  push:
    branches: [public-tour]
  workflow_dispatch:
    inputs:
      pages:
        description: Also deploy to GitHub Pages (Pages must be on for the repository)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-tour
  cancel-in-progress: true

jobs:
  build:
    runs-on: craci
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: cracicorp/setup@v1
        with:
          # Built-in presets stay on (npm, ubuntu, github). Extra hosts: Playwright's browser download, and GitHub's
          # artifact storage for the screenshots and the site.
          network: |
            default: deny
            connections:
              - tls:
                  serverNamePatterns: [cdn.playwright.dev, playwright.download.prss.microsoft.com, playwright.azureedge.net, "*.azureedge.net"]
                  ports: [443]
              - tls:
                  serverNamePatterns: [api.github.com, "*.actions.githubusercontent.com", "*.githubusercontent.com", "*.blob.core.windows.net"]
                  ports: [443]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Tour data from lessons/shared (frontend/tour/takes.json picks the takes)
        run: node scripts/tour/build-data.mjs
      - name: Bundled data matches the committed data
        run: git diff --stat --exit-code -- tour/data || echo "::warning::tour/data differs from the commit; the build uses the fresh files"
      - run: npm run lint
      - name: Unit tests (the whole suite, the normal app included)
        run: npm test
      - name: Normal app build is unchanged and still builds
        run: npm run build
      - name: Tour build (no env values reach it)
        run: npx vite build --config vite.tour.config.ts
      - name: Key-leak check
        run: node scripts/leak-check.mjs dist-tour
      - name: Size report
        run: |
          {
            echo "| File | Raw bytes | Gzip bytes |"
            echo "| --- | --- | --- |"
            find dist-tour -type f | sort | while read -r f; do
              echo "| ${f#dist-tour/} | $(wc -c < "$f") | $(gzip -9 -c "$f" | wc -c) |"
            done
            echo
            echo "Total raw: $(find dist-tour -type f -exec cat {} + | wc -c) bytes"
            echo "Total gzip (per file): $(find dist-tour -type f -exec sh -c 'gzip -9 -c "$1" | wc -c' _ {} \; | paste -sd+ | bc) bytes"
          } | tee tour-size.md >> "$GITHUB_STEP_SUMMARY"
      - name: Install Playwright chromium
        run: |
          npm i --no-save playwright@1.65
          npx playwright install --with-deps chromium
      - name: Browser check at the site root, as Netlify serves it (phone and desktop, screenshots, no calls out, load time)
        run: node e2e/tour-check.mjs dist-tour tour-check
      - name: Browser check under a sub-path, as GitHub Pages serves it
        run: TOUR_BASE=/HackJunction2026/ TOUR_BUDGET=off node e2e/tour-check.mjs dist-tour tour-check-subpath
      - name: Load metrics
        if: always()
        run: test -f tour-check/metrics.json && cat tour-check/metrics.json >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-check
          path: |
            frontend/tour-check
            frontend/tour-check-subpath
            frontend/tour-size.md
      - uses: actions/upload-artifact@v4
        with:
          name: tour-dist
          path: frontend/dist-tour
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.pages
        with:
          path: frontend/dist-tour

  netlify:
    # Deploys the checked build (the key-leak and browser checks passed in `build`) to Netlify. It needs the repository
    # secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID; without them every step after the check skips and the job passes.
    needs: build
    runs-on: craci
    env:
      HAS_NETLIFY: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
    steps:
      - name: Netlify secrets present?
        run: |
          if [ "$HAS_NETLIFY" = "true" ]; then echo "Netlify secrets found: deploying."; else echo "No NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets: skipping the deploy."; fi
      - uses: cracicorp/setup@v1
        if: env.HAS_NETLIFY == 'true'
        with:
          # npm preset for the CLI; Netlify's API for the upload; GitHub for the build artifact.
          network: |
            default: deny
            connections:
              - tls:
                  serverNamePatterns: [api.netlify.com]
                  ports: [443]
              - tls:
                  serverNamePatterns: [api.github.com, "*.actions.githubusercontent.com", "*.githubusercontent.com", "*.blob.core.windows.net"]
                  ports: [443]
      - uses: actions/setup-node@v4
        if: env.HAS_NETLIFY == 'true'
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        if: env.HAS_NETLIFY == 'true'
        with:
          name: tour-dist
          path: dist-tour
      - name: Deploy the prebuilt site to Netlify (production)
        if: env.HAS_NETLIFY == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/netlify" netlify-cli@27.19.0
          "$RUNNER_TEMP/netlify/node_modules/.bin/netlify" deploy --prod --dir=dist-tour --no-build --message "public-tour ${GITHUB_SHA::7}"

  pages:
    needs: build
    # Off by default: only a manual run with pages: true deploys, and Pages must be on (Settings, Pages, Source: GitHub Actions).
    if: github.event_name == 'workflow_dispatch' && inputs.pages
    runs-on: craci
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: cracicorp/setup@v1
        with:
          network: |
            default: deny
            connections:
              - tls:
                  serverNamePatterns: [api.github.com, "*.actions.githubusercontent.com", "*.githubusercontent.com", "*.blob.core.windows.net"]
                  ports: [443]
      - id: deployment
        uses: actions/deploy-pages@v4
