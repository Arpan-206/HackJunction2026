name: public-tour

# The public tour (docs/PUBLIC_TOUR.md): build it from the lesson-sync bundle, run the key-leak check and the browser
# check, upload the site, and deploy it. Only the public-tour branch runs this; nothing here touches the live app.
# The build uses no secret. Deploy: Netlify when the repository secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID exist
# (otherwise the job skips its steps); GitHub Pages only when started by hand with pages: true.

on:
  push:
    branches: [public-tour]
  workflow_dispatch:
    inputs:
      pages:
        description: Also deploy to GitHub Pages (Pages must be on for the repository)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-tour
  cancel-in-progress: true

jobs:
  build:
    runs-on: craci
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: cracicorp/setup@v1
        with:
          # Built-in presets stay on (npm, ubuntu, github). Extra hosts: Playwright's browser download, and GitHub's
          # artifact storage for the screenshots and the site.
          network: |
            default: deny
            connections:
              - tls:
                  serverNamePatterns: [cdn.playwright.dev, playwright.download.prss.microsoft.com, playwright.azureedge.net, "*.azureedge.net"]
                  ports: [443]
              - tls:
                  serverNamePatterns: [api.github.com, "*.actions.githubusercontent.com", "*.githubusercontent.com", "*.blob.core.windows.net"]
                  ports: [443]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Tour data from lessons/shared (frontend/tour/takes.json picks the takes)
        run: node scripts/tour/build-data.mjs
      - name: Bundled data matches the committed data
        run: git diff --stat --exit-code -- tour/data || echo "::warning::tour/data differs from the commit; the build uses the fresh files"
      - run: npm run lint
      - name: Unit tests (the whole suite, the normal app included)
        run: npm test
      - name: Normal app build is unchanged and still builds
        run: npm run build
      - name: Tour build (no env values reach it)
        run: npx vite build --config vite.tour.config.ts
      - name: Placeholder SBOM summary (the publish job replaces it with the real one)
        run: node scripts/tour/fetch-sbom.mjs dist-tour --placeholder
      - name: Key-leak check
        run: node scripts/leak-check.mjs dist-tour
      - name: Size report
        run: |
          {
            echo "| File | Raw bytes | Gzip bytes |"
            echo "| --- | --- | --- |"
            find dist-tour -type f | sort | while read -r f; do
              echo "| ${f#dist-tour/} | $(wc -c < "$f") | $(gzip -9 -c "$f" | wc -c) |"
            done
            echo
            echo "Total raw: $(find dist-tour -type f -exec cat {} + | wc -c) bytes"
            echo "Total gzip (per file): $(find dist-tour -type f -exec sh -c 'gzip -9 -c "$1" | wc -c' _ {} \; | paste -sd+ | bc) bytes"
          } | tee tour-size.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tour-dist
          path: frontend/dist-tour
      - name: Install Playwright chromium
        run: |
          npm i --no-save playwright@1.65
          npx playwright install --with-deps chromium
      - name: Browser check at the site root, as Netlify serves it (phone and desktop, screenshots, no calls out, load time)
        run: node e2e/tour-check.mjs dist-tour tour-check
      - name: Browser check under a sub-path, as GitHub Pages serves it
        run: TOUR_BASE=/HackJunction2026/ TOUR_BUDGET=off node e2e/tour-check.mjs dist-tour tour-check-subpath
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-check
          path: |
            frontend/tour-check
            frontend/tour-check-subpath
            frontend/tour-size.md

  publish:
    # The build job's SBOM is final only after that job ends, so this job fetches it, adds it to the site, checks the
    # site again (key leaks, and the "What's in this site" page against the SBOM file), and uploads the final site.
    needs: build
    runs-on: craci
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: cracicorp/setup@v1
        with:
          # Presets stay on (npm, ubuntu, github). Extra hosts: the CRACI API for the SBOM, Playwright's browser download,
          # and GitHub's artifact storage.
          network: |
            default: deny
            connections:
              - tls:
                  serverNamePatterns: [api.craci.com]
                  ports: [443]
              - tls:
                  serverNamePatterns: [cdn.playwright.dev, playwright.download.prss.microsoft.com, playwright.azureedge.net, "*.azureedge.net"]
                  ports: [443]
              - tls:
                  serverNamePatterns: [api.github.com, "*.actions.githubusercontent.com", "*.githubusercontent.com", "*.blob.core.windows.net"]
                  ports: [443]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: tour-dist
          path: frontend/dist-tour
      - name: Find the build job of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[] | select(.name == "build") | .id')
          echo "build job: $id"
          echo "TOUR_SBOM_JOB_ID=$id" >> "$GITHUB_ENV"
      - name: Fetch the build job's SBOM from CRACI
        env:
          CRACI_API_TOKEN: ${{ secrets.CRACI_API_TOKEN }}
          TOUR_SBOM_WAIT_S: "900"
        run: node scripts/tour/fetch-sbom.mjs dist-tour
      - name: Key-leak check of the final site (the SBOM and its summary included)
        run: node scripts/leak-check.mjs dist-tour
      - name: Install Playwright chromium
        run: |
          npm i --no-save playwright@1.65
          npx playwright install --with-deps chromium
      - name: Check the "What's in this site" page against the SBOM file
        run: node e2e/sbom-check.mjs dist-tour sbom-check
      - name: Zip the site (index.html at the top)
        run: |
          cd dist-tour && zip -qr ../geppetto-tour.zip . && cd .. && ls -l geppetto-tour.zip
          cat dist-tour/sbom-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tour-site
          path: frontend/dist-tour
      - uses: actions/upload-artifact@v4
        with:
          name: geppetto-tour-zip
          path: frontend/geppetto-tour.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-check
          path: frontend/sbom-check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.pages
        with:
          path: frontend/dist-tour

  netlify:
    # Deploys the final, checked site to Netlify. It needs the repository secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID;
    # without them every step after the first skips and the job passes.
    needs: publish
    runs-on: craci
    env:
      HAS_NETLIFY: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
    steps:
      - name: Netlify secrets present?
        run: |
          if [ "$HAS_NETLIFY" = "true" ]; then echo "Netlify secrets found: deploying."; else echo "No NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets: skipping the deploy."; fi
      - uses: cracicorp/setup@v1
        if: env.HAS_NETLIFY == 'true'
        with:
          # npm preset for the CLI; Netlify's API for the upload; GitHub for the site artifact.
          network: |
            default: deny
            connections:
              - tls:
                  serverNamePatterns: [api.netlify.com]
                  ports: [443]
              - tls:
                  serverNamePatterns: [api.github.com, "*.actions.githubusercontent.com", "*.githubusercontent.com", "*.blob.core.windows.net"]
                  ports: [443]
      - uses: actions/setup-node@v4
        if: env.HAS_NETLIFY == 'true'
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        if: env.HAS_NETLIFY == 'true'
        with:
          name: tour-site
          path: dist-tour
      - name: Deploy the prebuilt site to Netlify (production)
        if: env.HAS_NETLIFY == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/netlify" netlify-cli@27.19.0
          "$RUNNER_TEMP/netlify/node_modules/.bin/netlify" deploy --prod --dir=dist-tour --no-build --message "public-tour ${GITHUB_SHA::7}"

  pages:
    needs: publish
    # Off by default: only a manual run with pages: true deploys, and Pages must be on (Settings, Pages, Source: GitHub Actions).
    if: github.event_name == 'workflow_dispatch' && inputs.pages
    runs-on: craci
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: cracicorp/setup@v1
        with:
          network: |
            default: deny
            connections:
              - tls:
                  serverNamePatterns: [api.github.com, "*.actions.githubusercontent.com", "*.githubusercontent.com", "*.blob.core.windows.net"]
                  ports: [443]
      - id: deployment
        uses: actions/deploy-pages@v4
