# Geppetto core configuration. Every threshold lives here, never in code.

[server]
host = "0.0.0.0"
port = 8765
frame_rate_hz = 30
protocol_version = 1
lessons_dir = "lessons"
logs_dir = "logs"
schema_dir = "schema"

[sources]
# Which source feeds each physical hand: "glove", "camera" or "none".
left = "glove"
right = "glove"

[glove]
solver_host = "127.0.0.1"
solver_port = 12277
rcsp_host = "127.0.0.1"
rcsp_port = 45451
raw_port = 12276
silence_ms = 250
clock_window_s = 5.0
reconnect_s = 2.0

[rgmp]
# The solver's stream definition drives the parser. These settings say how
# to find joints inside it.
#
# Verified layout (Sat 14 Nov, real Smartgloves II, rkk-hand-solver
# --no-driver --emit both --emit-openxr --listen 127.0.0.1:12277; capture in
# backend/tests/fixtures/rgmp/worn_solver.rgmp.gz, STATUS.md "Verified on
# real data"):
# - device_type "solved_hand", timestamp_epoch "device_boot".
# - Three groups per device at 83.33 Hz: joints_local (428 B), joints_world
#   (728 B) and joints_openxr (728 B). With --emit both, joints_openxr is
#   group 2.
# - joints_openxr holds 26 TRANSFORM FLOAT[7] streams (position xyz, then a
#   quaternion), target_frame xr_palm, xr_wrist, ... xr_little_tip,
#   reference_frame xr_base. The xr_ prefix is stripped; 26 of 26 map by name.
# - The hand is always in device_info.hand ("left" or "right").
# - device_id is a hardware id (left 1572077328, right 2811174587), not a
#   small index, so its parity says nothing about the side.
# - No STATUS_FLAGS stream on 12277. "Heading reliable" is bit 11 of the hub
#   STATUS_FLAGS on the driver port 12276 only.
group = "joints_openxr"
joint_name_field = "target_frame"
position_measure_types = ["POSITION"]
orientation_measure_types = ["ORIENTATION", "ROTATION", "QUATERNION"]
pose_measure_types = ["POSE", "TRANSFORM"]
hand_fields = ["device_info.hand", "device_info.Hand", "device_info.side", "static_data.hand"]
left_values = ["left", "Left", "LEFT", "l", "L", "true"]
# Fallback when no hand field is found: even device_id is left, odd is right.
# Off: real ids are hardware ids, so parity would be right only by chance.
# The solver always sends device_info.hand; a device without it is refused
# with a log line rather than given a guessed side.
hand_from_device_id_parity = false

[rgmp.joint_aliases]
# stream joint name -> OpenXR joint name
pinky_metacarpal = "little_metacarpal"
pinky_proximal = "little_proximal"
pinky_intermediate = "little_intermediate"
pinky_distal = "little_distal"
pinky_tip = "little_tip"
hand_palm = "palm"
hand_wrist = "wrist"

[calibration]
# Per-wearer flat and fist calibration (core/calibration.py). Reads the files
# the backend stores from /gloves/calibrate and POST /calibrations; no second
# format. Loaded at start and again on every `calibrate` command. Glove hands
# only; the fake gloves skip it.
enabled = true
# The backend's data dir (its DATA_DIR setting), relative to this file.
data_dir = "backend/data"
# Wearer name as typed in the calibration screen. Empty: the newest flat and
# fist calibration saved for that side, whoever wore it. left_wearer and
# right_wearer override wearer per hand (master and learner on one pair).
wearer = ""
left_wearer = ""
right_wearer = ""
# Joints with a flat-to-fist range below this stay raw (0.05 rad, as the
# backend's CALIBRATION_MIN_RANGE_RAD).
min_range_deg = 2.9
# Calibrated fraction of the wearer's range is clipped to [clip_low,
# clip_high], then times [hand] curl_full_deg (thumb curl_full_thumb_deg).
# 1.0 matches the backend's clip; a tight fist past the captured loose fist
# reads the same as it.
clip_low = 0.0
clip_high = 1.0
# Cap on full / (fist - flat). The real thumb moves only about 14 deg between
# flat and fist in the core's angles; without a cap its noise is multiplied
# by 4 (STATUS.md "Calibrated angles"). 0 turns the cap off.
max_gain = 2.0

[camera]
device = 0
video = ""
mirror = true
model_path = "models/hand_landmarker.task"
num_hands = 2
min_detection_confidence = 0.5
min_presence_confidence = 0.5
min_tracking_confidence = 0.5
latency_us = 60000
silence_ms = 300
metacarpal_fraction = 0.25
# Where a camera hand is drawn in the world: a plane in front of the viewer.
plane_width_m = 0.6
plane_height_m = 0.4
plane_y_m = 0.1
plane_z_m = -0.3
one_euro_min_cutoff = 1.5
one_euro_beta = 0.05
one_euro_d_cutoff = 1.0

[hand]
curl_full_deg = 90
curl_full_thumb_deg = 60
pinch_on_m = 0.015
pinch_off_m = 0.030
joint_decimals = 4

[score]
# 15 / 60 from the real-capture study on calibrated angles (STATUS-core.md): the
# right pose passes 100%, the wrong pose 3%. SPEC's 8 / 45 passed the right pose 67%.
perfect_deg = 15
wrong_deg = 60
pass_score = 0.85
ema_tau_ms = 150
move_window_ms = 250
move_pass_mean = 0.75
stuck_s = 5.0
hold_ms_default = 500
timing_hint_ms = 150
spread_weight = 0.5
# The one to fix (frame `worst`, its hint, the summary's fingers) is only ever
# a finger whose step weight is at least this (STATUS-weights.md). With no
# finger that heavy, the heaviest non-zero fingers stand in.
focus_min_weight = 0.3

[score.camera]
# Wider tolerances when either hand being scored comes from the camera.
perfect_deg = 15
wrong_deg = 60

[record]
rate_hz = 83.33
still_deg_s = 20
still_min_ms = 400
key_window_ms = 300
static_finger_deg = 15
static_finger_weight = 0.5
hold_fraction = 0.5
default_weights = { thumb = 1.0, index = 1.0, middle = 1.0, ring = 1.0, little = 1.0 }
# Step weight = static x consistency x chart x calibration (core/recorder.py
# step_weights, STATUS-weights.md). Consistency: steps whose key poses differ by
# at most take_match_deg (largest per-finger mean flexion difference) are takes
# of one pose, or task_config `takes = N` says the lesson is N repeats of one
# sequence. A finger whose flexion varies across takes by a standard deviation
# of consistent_deg or less keeps weight 1; inconsistent_deg or more drops to
# inconsistent_floor. Chart: fingers the task's chart names for the step (typing
# keys, piano notes, task_config `fingers`) keep 1, the rest chart_other_weight.
take_match_deg = 12
consistent_deg = 4
inconsistent_deg = 15
inconsistent_floor = 0.2
chart_other_weight = 0.2

[session]
default_roles = { left = "free", right = "learner" }
mirror_delay_ms = 300
tempo_default = 1.0
tempo_min = 0.25
tempo_max = 1.5
loop_default = true
control_pinch = "little"
control_pinch_hold_ms = 500
# the control gesture needs index, middle and ring under this curl (a fist is not a control pinch)
control_pinch_max_other_curl = 0.5
rate_hz_min = 15
rate_hz_max = 60
duel_rounds = 5

[coach]
min_interval_s = 4.0
speak = true
text_max_chars = 120

[fusion]
hold_ms = 300
ease_ms = 500

[rest_pose]
left = { p = [-0.15, 0.10, -0.20], q = [0.0, 0.0, 0.0, 1.0] }
right = { p = [0.15, 0.10, -0.20], q = [0.0, 0.0, 0.0, 1.0] }

[fake]
step_period_s = 8.0
rate_hz = 83.33
hand_rate_hz = 60

[piano]
# Key press: knuckle flexion rises faster than press_velocity_deg_s and ends at
# least press_min_deg past its resting value. Release when back within release_deg.
press_velocity_deg_s = 250
press_min_deg = 12
release_deg = 6
rest_tau_ms = 2000
good_ms = 120
near_ms = 300
default_tempo_bpm = 70

[typing]
# Typing task (core/tasks/typing.py). Keystrokes move a finger far less than a
# piano press: the first real-glove typing capture (14 Nov) gave 2 presses in 64 s
# with the [piano] thresholds and 46 with these. Still unvalidated: no clean capture yet.
press_velocity_deg_s = 60
press_min_deg = 4
release_deg = 2
rest_tau_ms = 2000
# Window around each keydown, and how a finger wins it.
pre_ms = 150
post_ms = 120
min_peak_deg_s = 40.0
clear_ratio = 1.5

[robot]
# Robot hand output: the 18 angle features retargeted to joint targets.
# Joint names and limits come from the URDF files, never from code.
model = "dex3_1"
urdf_left = "models/robots/dex3_1/dex3_1_l.urdf"
urdf_right = "models/robots/dex3_1/dex3_1_r.urdf"
# URDF joint name for a retarget key: {side} is "left" or "right", {key} is the table key below.
joint_name = "{side}_hand_{key}_joint"
# Startup source: "master", "learner", "lesson" or "off". Change at runtime with set_robot_source.
source = "off"
# Human flexion joints per finger, for the fidelity score (thumb has 2, the others 3).
human_dofs = { thumb = 2, index = 3, middle = 3, ring = 3, little = 3 }

# Each robot joint = offset_deg + sum(weight * angle_feature_deg), in radians, clamped to the URDF limits.
# The flexion sign follows the URDF: the side of the limit range with the larger magnitude is the
# flexion direction (left index 0..-1.57 flexes negative, right 0..+1.57 flexes positive). Set
# sign_left / sign_right to force it. Unverified against Unitree's renderer: flip here, not in code.
[robot.retarget.thumb_0]
finger = "thumb"
offset_deg = -40.0
weights = { spread_thumb_index = 1.0 }
sign_left = 1.0
sign_right = -1.0

[robot.retarget.thumb_1]
finger = "thumb"
offset_deg = 0.0
weights = { thumb_mcp = 1.0 }

[robot.retarget.thumb_2]
finger = "thumb"
offset_deg = 0.0
weights = { thumb_ip = 1.0 }

[robot.retarget.index_0]
finger = "index"
offset_deg = 0.0
weights = { index_mcp = 1.0 }

[robot.retarget.index_1]
finger = "index"
offset_deg = 0.0
weights = { index_pip = 0.7, index_dip = 0.5 }

[robot.retarget.middle_0]
finger = "middle"
offset_deg = 0.0
weights = { middle_mcp = 1.0 }

[robot.retarget.middle_1]
finger = "middle"
offset_deg = 0.0
weights = { middle_pip = 0.7, middle_dip = 0.5 }

[camera.record3dstream]
# iPhone LiDAR over WiFi or USB from the free Record3DStream app (PathOn). The app shows
# its address on screen; it is NOT a web page, it is a binary TCP stream of REC3D frames.
# The port is the app's default. Change host to the phone's current address.
host = "10.0.34.248"
port = 8888
timeout_s = 5.0
# true: connect over the USB cable through iproxy (libimobiledevice) instead of WiFi;
# host is then ignored and the same port is used on both ends
usb = false
# depth pixels with confidence below this count as missing (0 low, 1 medium, 2 high)
min_confidence = 1

[camera.geppetto_depth]
# Our own iPhone app (ios/GeppettoDepth) over the USB cable. Run ios/mac/forward.sh first.
host = "127.0.0.1"
port = 7700
timeout_s = 5.0
min_confidence = 1
