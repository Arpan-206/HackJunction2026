[project]
name = "geppetto-export"
version = "0.1.0"
description = "Export Geppetto lessons and Dex3-1 robot joint targets as LeRobot dataset episodes"
readme = "README.md"
authors = [
    { name = "Arpan Pandey", email = "arpanpandey.aps@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.3.3",
    "numpy>=2",
]

[project.scripts]
geppetto-export = "geppetto_export.export:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
# Security overrides (CRACI): fsspec CVE-2026-104851, torch CVE-2026-24747.
# datasets 3.6.0 (through lerobot 0.3.3) pins fsspec<=2025.3.0, and
# lerobot 0.3.3 pins torch<2.8. torchvision moves with torch.
override-dependencies = ["fsspec[http]>=2026.6.0", "torch>=2.10.0", "torchvision>=0.25.0"]
