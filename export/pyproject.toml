[project]
name = "geppetto-export"
version = "0.1.0"
description = "Export Geppetto lessons and Dex3-1 robot joint targets as LeRobot dataset episodes"
readme = "README.md"
authors = [
    { name = "Arpan Pandey" }
]
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.3.3",
    "numpy>=2",
]

[project.scripts]
geppetto-export = "geppetto_export.export:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
